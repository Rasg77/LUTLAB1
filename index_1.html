<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="LUTLAB — فلاتر تلوين سينمائية للمصورين وصناع المحتوى">
</head>
<body>
<title>LUTLAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;600&family=Readex+Pro:wght@200;300;400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one product, one long dark "screening room" scroll — a widescreen viewer is the hero, everything else sits under it like credits. */
:root{
  color-scheme: dark;
  --ink:#000000;          /* the logo's black: everything sits on it */
  --panel:#0b0b0e;
  --line:#1c1c22;
  --fg:#ececef;
  --muted:#8b8b96;
  --dim:#55555f;
  --s1:#f6a623; --s2:#ec5b7c; --s3:#8b6cf2; --s4:#4fb5e6; --s5:#8ddc7a;
  --spectrum:linear-gradient(90deg,var(--s1),var(--s2) 30%,var(--s3) 55%,var(--s4) 78%,var(--s5));
  --display:"Lexend","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro","Lexend",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
a{color:inherit}
:focus-visible{outline:2px solid var(--s4);outline-offset:3px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .label{letter-spacing:.04em;text-transform:none;font-family:var(--body);font-size:13px}

/* nav */
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{height:34px;width:auto;mix-blend-mode:screen}
.brand span{font-family:"Lexend",sans-serif;font-weight:300;letter-spacing:.38em;font-size:14px}
.nav nav{display:flex;gap:22px;margin-inline-start:auto}
.nav nav a{text-decoration:none;color:var(--muted);font-size:14px}
.nav nav a:hover{color:var(--fg)}
.lang{background:none;border:1px solid var(--line);color:var(--fg);font:500 12px var(--mono);padding:7px 11px;border-radius:999px;cursor:pointer}
.lang:hover{border-color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--fg);color:#000;text-decoration:none;font-weight:500;font-size:15px;padding:12px 22px;border-radius:999px;border:0;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
@media (max-width:760px){.nav nav{display:none}.brand span{display:none}.nav .lang{margin-inline-start:auto}}

/* intro (home) */
.intro{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.intro-img{position:absolute;inset:0 0 0 auto;width:62%;}
[dir="rtl"] .intro-img{inset:0 auto 0 0}
.intro-img img{width:100%;height:100%;object-fit:cover;display:block;max-width:100%}
.intro-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0%,rgba(0,0,0,.55) 35%,rgba(0,0,0,.1) 100%)}
[dir="rtl"] .intro-img::after{background:linear-gradient(270deg,var(--ink) 0%,rgba(0,0,0,.55) 35%,rgba(0,0,0,.1) 100%)}
.intro-in{position:relative;padding-block:clamp(72px,11vw,150px)}
.intro-copy{max-width:560px;display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.intro h1{font-family:var(--display);font-weight:200;font-size:clamp(36px,5.6vw,72px);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
[dir="rtl"] .intro h1{font-family:"Readex Pro",sans-serif;line-height:1.25;letter-spacing:0}
.intro h1 em{font-style:normal;font-family:"Lexend",sans-serif;font-weight:300;letter-spacing:.12em;background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{color:#c9c9d1;font-size:18px;margin:0;max-width:46ch}
@media (max-width:760px){.intro-img{position:relative;width:100%;height:220px;inset:auto}.intro-img::after{background:linear-gradient(0deg,var(--ink),rgba(0,0,0,0) 60%)!important}.intro-in{padding-block:8px 56px}}

/* products grid */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);text-decoration:none;color:var(--fg);transition:border-color .2s,transform .2s;min-width:0}
.pcard:hover{border-color:var(--dim);transform:translateY(-2px)}
.pcard canvas,.pcard img{display:block;width:100%;aspect-ratio:2/1;height:auto;background:#111}
.pcard .pb{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard h3{margin:0;font-weight:400;font-size:19px}
.pcard p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.pcard .pf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.pcard .pp{font-variant-numeric:tabular-nums;font-size:20px}
.pcard .pp s{color:var(--dim);font-size:13px;margin-inline-start:8px}
.pcard .go{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.pcard.soon{border-style:dashed;background:none;justify-content:center;align-items:center;text-align:center;padding:32px;min-height:220px;color:var(--dim)}
.pcard.soon:hover{transform:none;border-color:var(--line)}
@media (max-width:860px){.pgrid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.pgrid{grid-template-columns:1fr}}
.crumbs{display:flex;gap:10px;padding-block:20px 0;color:var(--dim);font-size:14px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--fg)}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:center}
.contact h2{font-family:var(--display);font-weight:300;font-size:clamp(28px,3.6vw,44px);line-height:1.15;margin:12px 0;text-wrap:balance}
[dir="rtl"] .contact h2{font-family:"Readex Pro",sans-serif;line-height:1.35}
.contact p{color:var(--muted);margin:0;max-width:46ch}
.mailbox{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:14px;min-width:0}
.mailbox::before{content:"";position:absolute;inset:-1px -1px auto -1px;height:2px;border-radius:10px 10px 0 0;background:var(--spectrum)}
.mail{font-family:"Lexend",sans-serif;font-weight:300;font-size:clamp(22px,3vw,32px);text-decoration:none;overflow-wrap:anywhere;user-select:all}
[dir="rtl"] .mail{text-align:right}
.mail-actions{display:flex;flex-wrap:wrap;gap:10px}
.mailbox .note{color:var(--dim);font-size:13px;min-height:1.2em}
@media (max-width:760px){.contact{grid-template-columns:1fr}}

/* hero */
.hero{padding-block:clamp(40px,7vw,88px) 32px}
.hero-top{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(24px,5vw,72px);align-items:end;margin-bottom:36px}
.hero h1{font-family:var(--display);font-weight:200;font-size:clamp(38px,6.4vw,84px);line-height:1.02;letter-spacing:-.02em;margin:14px 0 0;text-wrap:balance}
[dir="rtl"] .hero h1{font-family:"Readex Pro",sans-serif;line-height:1.2;letter-spacing:0}
.hero h1 em{font-style:normal;background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lede{color:var(--muted);font-size:17px;max-width:44ch;margin:0 0 22px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.price-inline{font-family:var(--mono);font-size:13px;color:var(--muted)}
@media (max-width:860px){.hero-top{grid-template-columns:1fr;align-items:start}}

/* viewer */
.viewer{position:relative}
.frame{position:relative;aspect-ratio:1600/798;max-width:100%;width:100%;overflow:hidden;border-radius:var(--r);background:#111;user-select:none;touch-action:pan-y;cursor:ew-resize}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#after{clip-path:inset(0 0 0 var(--split,50%))}
.handle{position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;margin-left:-1px;background:var(--spectrum);background:linear-gradient(180deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5));pointer-events:none}
.handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.55);border:1.5px solid #fff;backdrop-filter:blur(6px)}
.handle::before{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);z-index:1;color:#fff;font:500 13px var(--mono);white-space:nowrap}
.tag{position:absolute;top:12px;font:500 10.5px var(--mono);letter-spacing:.14em;padding:5px 9px;border-radius:3px;background:rgba(0,0,0,.6);color:#fff;pointer-events:none}
.tag.l{left:12px}.tag.r{right:12px}
.frame input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.meta-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;margin-top:12px;color:var(--dim)}

/* look picker */
.looks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:22px}
.look{background:none;border:1px solid var(--line);border-radius:var(--r);padding:0;cursor:pointer;color:var(--fg);text-align:start;overflow:hidden;transition:border-color .2s}
.look canvas{display:block;width:100%;aspect-ratio:2/1;height:auto}
.look .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:8px 10px}
.look .t b{font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.look .t i{font-style:normal;font:11px var(--mono);color:var(--dim)}
.look:hover{border-color:var(--dim)}
.look[aria-pressed="true"]{border-color:var(--fg)}
@media (max-width:860px){.looks{grid-template-columns:repeat(3,minmax(0,1fr))}.look .t i{display:none}}

/* sections */
section.blk{padding-block:clamp(56px,8vw,110px);border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:1fr 2fr;gap:24px;margin-bottom:44px}
.sec-head h2{font-family:var(--display);font-weight:300;font-size:clamp(28px,3.6vw,44px);line-height:1.12;letter-spacing:-.01em;margin:0;text-wrap:balance}
[dir="rtl"] .sec-head h2{font-family:"Readex Pro",sans-serif;line-height:1.35}
.sec-head p{color:var(--muted);margin:0;max-width:56ch;align-self:end}
@media (max-width:760px){.sec-head{grid-template-columns:1fr}}

.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r)}
.spec{padding:22px 20px;border-inline-end:1px solid var(--line);min-width:0}
.spec:last-child{border-inline-end:0}
.spec .v{font-family:var(--display);font-weight:200;font-size:clamp(26px,2.8vw,38px);line-height:1;margin:12px 0 8px;font-variant-numeric:tabular-nums}
.spec .d{color:var(--muted);font-size:14px}
@media (max-width:760px){.specs{grid-template-columns:1fr 1fr}.spec:nth-child(2){border-inline-end:0}.spec:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.chips-row{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center;margin-top:24px}
.chips-row .label{margin:0}
.apps{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:760px){.chips-row{grid-template-columns:1fr;gap:10px}}
.app{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--fg)}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,40px);counter-reset:s}
.step{border-top:1px solid var(--dim);padding-top:18px;min-width:0}
.step .n{font:500 12px var(--mono);color:var(--muted)}
.step h3{font-weight:400;font-size:19px;margin:10px 0 6px}
.step p{color:var(--muted);margin:0;font-size:15px}
.step code{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:4px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* buy */
.buy{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:center}
.card{position:relative;border:1px solid var(--line);border-radius:10px;padding:clamp(22px,3vw,36px);background:var(--panel)}
.card::before{content:"";position:absolute;inset:-1px -1px auto -1px;height:2px;border-radius:10px 10px 0 0;background:var(--spectrum)}
.price{display:flex;align-items:baseline;gap:12px;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.price .now{font-family:var(--display);font-weight:200;font-size:64px;line-height:1}
.price .cur{font-size:18px;color:var(--muted)}
.price s{color:var(--dim);font-family:var(--mono);font-size:15px}
.incl{list-style:none;padding:0;margin:22px 0 26px;display:grid;gap:10px}
.incl li{display:flex;gap:12px;align-items:baseline;color:var(--fg);font-size:15px}
.incl li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--spectrum);transform:translateY(-1px)}
.card .btn{width:100%;justify-content:center;padding:15px}
.card .note{color:var(--dim);font-size:13px;margin-top:12px;text-align:center}
.buy-logo img{width:100%;max-width:440px;mix-blend-mode:screen;display:block;margin-inline:auto}
@media (max-width:860px){.buy{grid-template-columns:1fr}.buy-logo{order:-1}.buy-logo img{max-width:280px}}

/* faq */
.faq{max-width:820px}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;font-size:17px;font-weight:400}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:300 22px var(--mono);color:var(--muted);line-height:1;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--muted);margin:10px 0 0;max-width:62ch}

footer{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--dim);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center}
</style>

let lang = "ar";
try{ lang = localStorage.getItem("lutlab-lang") || "ar"; }catch(e){}

function applyLang(){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el=>{
    const v = d[el.dataset.i]||"";
    if(el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.getElementById("langBtn").textContent = lang==="ar" ? "EN" : "عربي";
  document.getElementById("pNow").textContent = STORE.price;
  document.getElementById("pCur").textContent = d.cur;
  document.getElementById("pOld").textContent = STORE.oldPrice ? STORE.oldPrice+" "+d.cur : "";
  document.getElementById("heroPrice").textContent = STORE.price+" "+d.cur;
  renderLookList();
  renderProducts();
}
function renderProducts(){
  const g=document.getElementById("pgrid"); g.innerHTML="";
  const d=T[lang];
  PRODUCTS.forEach(P=>{
    const a=document.createElement("a"); a.className="pcard"; a.href="#"+P.id;
    let media;
    if(P.image){ media=document.createElement("img"); media.src=P.image; media.alt=""; }
    else { media=document.createElement("canvas"); media.width=480; media.height=240; media.className="live-thumb"; drawCardThumb(media); }
    const pb=document.createElement("div"); pb.className="pb";
    pb.innerHTML='<h3></h3><p></p><div class="pf"><span class="pp"></span><span class="go"></span></div>';
    pb.querySelector("h3").textContent=P[lang].name;
    pb.querySelector("p").textContent=P[lang].desc;
    pb.querySelector(".pp").innerHTML=P.price+" "+d.cur+(P.oldPrice?"<s>"+P.oldPrice+" "+d.cur+"</s>":"");
    pb.querySelector(".go").textContent=d.view;
    a.append(media,pb); g.append(a);
  });
  const s=document.createElement("div"); s.className="pcard soon"; s.textContent=d.soon; g.append(s);
}
function drawCardThumb(c){ if(typeof scene!=="undefined" && scene && graded[0]){ const t=document.createElement("canvas"); t.width=W;t.height=H; t.getContext("2d").putImageData(graded[0],0,0); c.getContext("2d").drawImage(t,0,0,c.width,c.height); } }

const PRODUCT_ANCHORS=["looks","inside","how","buy"];
function route(){
  const h=location.hash.slice(1);
  const inProduct = PRODUCTS.some(P=>P.id===h) || PRODUCT_ANCHORS.includes(h);
  document.getElementById("homeView").hidden = inProduct;
  document.getElementById("productView").hidden = !inProduct;
  if(PRODUCTS.some(P=>P.id===h)) window.scrollTo(0,0);
  else if(h){ const el=document.getElementById(h); if(el) el.scrollIntoView(); }
}
addEventListener("hashchange",route);

/* ===== Scene: a procedural desert road at dusk, rendered once as "neutral" pixels ===== */
const W=1600, H=798;
function rnd(seed){ return ()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; }; }
function ridge(r, base, amp, oct){
  const pts=[]; const ph=[...Array(oct)].map(()=>r()*6.28);
  for(let x=0;x<=W;x+=3){ let y=base; for(let o=0;o<oct;o++){ y+=Math.sin(x*0.004*(o+1)*1.7+ph[o])*amp/(o+1); } pts.push([x,y]); }
  return pts;
}

function loadShot(cb){
  const im=new Image();
  im.onload=()=>{ const c=document.createElement("canvas"); c.width=W;c.height=H; const g=c.getContext("2d"); g.drawImage(im,0,0,W,H); cb(g.getImageData(0,0,W,H)); };
  im.src=SHOT;
}
// Log footage -> display-referred base: stretch the flat range and restore saturation
function normalize(src){
  const out=new ImageData(W,H), d=src.data, o=out.data, lo=.19, hi=.76, k=.84;
  for(let i=0;i<d.length;i+=4){
    let r=.05+k*(d[i]/255-lo)/(hi-lo), g=.05+k*(d[i+1]/255-lo)/(hi-lo), b=.05+k*(d[i+2]/255-lo)/(hi-lo);
    const y=.2126*r+.7152*g+.0722*b;
    r=y+(r-y)*1.2; g=y+(g-y)*1.2; b=y+(b-y)*1.2;
    o[i]=clamp(r)*255; o[i+1]=clamp(g)*255; o[i+2]=clamp(b)*255; o[i+3]=255;
  }
  return out;
}

/* ===== Grades ===== */
const LOOKS=[
 {id:"LL-01",ar:"تيل وعنبر",en:"Teal / Amber", sh:[-.06,.05,.09], hi:[.10,.03,-.08], con:1.28, sat:1.18, lift:.0, gam:1.0},
 {id:"LL-02",ar:"ذهب الصحراء",en:"Desert Gold", sh:[.03,.01,-.03], hi:[.12,.06,-.10], con:1.15, sat:1.12, lift:.03, gam:.95},
 {id:"LL-03",ar:"ليل أزرق",en:"Blue Hour", sh:[-.05,.0,.12], hi:[-.04,.02,.06], con:1.22, sat:.75, lift:.0, gam:1.18},
 {id:"LL-04",ar:"فيلم باهت",en:"Faded Film", sh:[-.02,.05,.02], hi:[.06,.03,-.04], con:.88, sat:.82, lift:.09, gam:1.02, grain:.05},
 {id:"LL-05",ar:"شفق نيون",en:"Neon Dusk", sh:[.07,-.04,.12], hi:[-.03,.06,.06], con:1.25, sat:1.3, lift:.0, gam:1.05},
 {id:"LL-06",ar:"فضي",en:"Silver Mono", mono:true, sh:[0,0,.01], hi:[.01,.01,0], con:1.38, sat:0, lift:.01, gam:1.05, grain:.04}
];
const clamp=v=>v<0?0:v>1?1:v;
function gradePixel(r,g,b,L){
  let y=.2126*r+.7152*g+.0722*b;
  if(L.mono){ r=g=b=y; }
  else{ r=y+(r-y)*L.sat; g=y+(g-y)*L.sat; b=y+(b-y)*L.sat; }
  const s=(1-y)*(1-y), h=y*y;
  r+=L.sh[0]*s+L.hi[0]*h; g+=L.sh[1]*s+L.hi[1]*h; b+=L.sh[2]*s+L.hi[2]*h;
  const c=x=>{ x=clamp(x); x=Math.pow(x,L.gam); x=.5+(x-.5)*L.con; x=clamp(x); x=x*x*(3-2*x)*.35+x*.65; return L.lift+x*(1-L.lift); };
  return [c(r),c(g),c(b)];
}
function applyGrade(src,L,out){
  const d=src.data, o=out.data, rr=rnd(3);
  for(let i=0;i<d.length;i+=4){
    let [r,g,b]=gradePixel(d[i]/255,d[i+1]/255,d[i+2]/255,L);
    if(L.grain){ const n=(rr()-.5)*L.grain; r+=n; g+=n; b+=n; }
    o[i]=clamp(r)*255; o[i+1]=clamp(g)*255; o[i+2]=clamp(b)*255; o[i+3]=255;
  }
  return out;
}
function logify(src,out){
  const d=src.data,o=out.data;
  for(let i=0;i<d.length;i+=4){
    const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255, y=.2126*r+.7152*g+.0722*b;
    const f=x=>.2+.55*Math.pow(y+(x-y)*.55,.62);
    o[i]=f(r)*255;o[i+1]=f(g)*255;o[i+2]=f(b)*255;o[i+3]=255;
  }
  return out;
}

let scene=null, thumbs=null;
const bctx=document.getElementById("before").getContext("2d");
const actx=document.getElementById("after").getContext("2d");

let current=0;
const graded={};
function gradeFull(i){
  if(!graded[i]) graded[i]=applyGrade(scene,LOOKS[i],actx.createImageData(W,H));
  return graded[i];
}
function setLook(i){
  current=i;
  if(scene) actx.putImageData(gradeFull(i),0,0);
  document.getElementById("lookMeta").textContent=LOOKS[i].id+" · "+LOOKS[i].en.toUpperCase();
  document.getElementById("tagR").textContent=LOOKS[i].id;
  document.querySelectorAll(".look").forEach((b,k)=>b.setAttribute("aria-pressed",k===i));
}

const TW=240, TH=120;
function makeThumbs(){
  const c0=document.createElement("canvas"); c0.width=TW;c0.height=TH;
  const t=document.createElement("canvas"); t.width=W;t.height=H; t.getContext("2d").putImageData(scene,0,0);
  c0.getContext("2d").drawImage(t,0,0,TW,TH);
  const src=c0.getContext("2d").getImageData(0,0,TW,TH);
  thumbs=LOOKS.map(L=>{ const c=document.createElement("canvas"); c.width=TW;c.height=TH; const x=c.getContext("2d"); x.putImageData(applyGrade(src,L,x.createImageData(TW,TH)),0,0); return c; });
}

function renderLookList(){
  const list=document.getElementById("lookList"); list.innerHTML="";
  LOOKS.forEach((L,i)=>{
    const b=document.createElement("button"); b.type="button"; b.className="look"; b.setAttribute("aria-pressed",i===current);
    const c=document.createElement("canvas"); c.width=TW;c.height=TH; if(thumbs) c.getContext("2d").drawImage(thumbs[i],0,0);
    const t=document.createElement("div"); t.className="t"; t.innerHTML="<b></b><i></i>";
    t.querySelector("b").textContent=L[lang]; t.querySelector("i").textContent=L.id;
    b.append(c,t); b.addEventListener("click",()=>setLook(i)); list.append(b);
  });
}

// split slider
const frame=document.getElementById("frame"), range=document.getElementById("split");
function setSplit(v){ frame.style.setProperty("--split",v+"%"); }
range.addEventListener("input",()=>setSplit(range.value));
setSplit(50);
// gentle intro sweep
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  let t0=null; const anim=ts=>{ if(t0===null)t0=ts; const p=Math.min((ts-t0)/1600,1); const v=50+Math.sin(p*Math.PI*2)*22*(1-p); setSplit(v); range.value=v; if(p<1 && !touched) requestAnimationFrame(anim); };
  var touched=false; range.addEventListener("pointerdown",()=>touched=true,{once:true});
  setTimeout(()=>requestAnimationFrame(anim),500);
}

applyLang();
setLook(0);
route();
loadShot(raw=>{
  bctx.putImageData(raw,0,0);
  scene=normalize(raw);
  makeThumbs(); renderLookList(); setLook(current);
  document.querySelectorAll(".live-thumb").forEach(drawCardThumb);
});
